name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Cacs.Web/package-lock.json

      - name: Build Tailwind CSS
        working-directory: Cacs.Web
        run: npm ci && npm run build:css

      - name: Restore
        run: dotnet restore Cacs.slnx

      - name: Build
        run: dotnet build Cacs.slnx --no-restore

      - name: Test
        run: dotnet test Cacs.slnx --no-build --verbosity normal

      - name: Verify formatting
        run: dotnet format Cacs.slnx --verify-no-changes
