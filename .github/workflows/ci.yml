name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Cacs.slnx

      - name: Build
        run: dotnet build Cacs.slnx --no-restore

      - name: Test
        run: dotnet test Cacs.slnx --no-build --verbosity normal

      - name: Verify formatting
        run: dotnet format Cacs.slnx --verify-no-changes
